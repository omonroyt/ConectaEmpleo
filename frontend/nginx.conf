# nginx para la SPA (equivale a `public/.htaccess`, que solo sirve en Apache).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Rutas de React Router: todo lo que no sea un archivo real vuelve a index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets de Vite (con hash en el nombre) y fondos de marca: caché de un año.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html nunca se cachea: siempre debe apuntar a los assets más recientes.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
